name: Generate Snake

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate github-contribution-grid-snake
        uses: Platane/snk@v3
        with:
          github_user_name: sadiqdevarshi
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg

      - name: List generated files
        run: |
          echo "Dist contents:"
          ls -la dist || true

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v3
        with:
          name: snake-dist
          path: dist/*

      - name: Publish generated files to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin output >/dev/null 2>&1; then
            git fetch origin output
            git checkout -B output origin/output
          else
            git checkout -B output
          fi

          cp dist/github-snake.svg github-snake.svg
          cp dist/github-snake-dark.svg github-snake-dark.svg

          git add github-snake.svg github-snake-dark.svg
          git commit -m "Generate snake animation" || echo "No changes to commit"
          git push origin output --force
